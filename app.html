<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, follow" />
<title>Télécharger DiabeteFood</title>
<link rel="canonical" href="https://diabetefood.com/" />
<link rel="icon" type="image/png" href="/app-icon.png" />
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#FFF7F0;color:#2C1810;text-align:center;padding:48px 24px;margin:0}
img{border-radius:16px}
h1{font-size:26px;margin:16px 0 8px}
p{color:#8B7568;margin:0 0 20px}
a{display:block;max-width:320px;margin:14px auto;padding:16px;border-radius:14px;background:#000;color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<img src="/app-icon.png" width="72" height="72" alt="DiabeteFood" />
<h1>Télécharger DiabeteFood</h1>
<p>Choisissez votre store :</p>
<a href="https://apps.apple.com/app/diabetefood/id6764684903">App Store (iPhone)</a>
<a href="https://play.google.com/store/apps/details?id=com.diabetefood.scanner&hl=fr">Google Play (Android)</a>
<script>
// Page du QR code : envoie directement vers le bon store selon le téléphone.
(function(){var ua=navigator.userAgent||"";if(/iPad|iPhone|iPod/.test(ua)||(navigator.maxTouchPoints>1&&/Macintosh/.test(ua))){location.replace("https://apps.apple.com/app/diabetefood/id6764684903");}else if(/android/i.test(ua)){location.replace("https://play.google.com/store/apps/details?id=com.diabetefood.scanner&hl=fr");}})();
</script>
<script id="df-attr">
(function(){try{var r=document.referrer||"",g=/^https?:\/\/(www\.)?google\./i.test(r),k="df_src";
try{if(g)sessionStorage.setItem(k,"google");else if(sessionStorage.getItem(k)==="google")g=true;}catch(e){}
var p=location.pathname,de=p.indexOf("/de/")===0,slug=(p.split("/").filter(Boolean).pop()||"index").replace(/\.html$/,"");
var src=g?"google":"diabetefood.com",med=g?"organic":(de?"ratgeber":"guides"),camp=(de?"ratgeber-":"guide-")+slug;
var ref="utm_source="+src+"&utm_medium="+med+"&utm_campaign="+camp;
document.querySelectorAll('a[href*="play.google.com/store/apps/details"]').forEach(function(a){var u=new URL(a.href);u.searchParams.set("referrer",ref);a.href=u.toString();});
document.querySelectorAll('a[href*="apps.apple.com"]').forEach(function(a){var u=new URL(a.href);u.searchParams.set("ct",((g?"seo-":"site-")+slug).slice(0,40));a.href=u.toString();});
}catch(e){}})();
</script>
</body>
</html>
